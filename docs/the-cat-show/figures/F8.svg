<svg xmlns="http://www.w3.org/2000/svg" width="960" viewBox="0 0 960 468" role="img" aria-labelledby="F8-t" font-family="ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12"><title id="F8-t">were the refusals right</title><defs><pattern id="miss-F8" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" style="fill:#ece9e2"/><line x1="0" y1="0" x2="0" y2="6" style="stroke:#b5b1a8" stroke-width="2"/></pattern></defs><rect width="960" height="468" style="fill:#f7f5f0"/><text x="24" y="26" font-size="15" text-anchor="start" font-weight="600" style="fill:#1d1d1b;font-variant-numeric:tabular-nums">Were the refusals right? Refusal-held share per column, one referee family</text><text x="24" y="44" font-size="11" text-anchor="start" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">filled = the page&#x27;s verdict words · hollow = the referee&#x27;s raw table, in parentheses · the fraction is the number; plants excluded; one referee family only</text><text x="242" y="82" font-size="12" text-anchor="end" font-weight="600" style="fill:#3b6fb6;font-variant-numeric:tabular-nums">Opus 5</text><line x1="250" y1="98" x2="660.0" y2="98" style="stroke:#d9d6cf" stroke-width="0.6"/><circle cx="386.9" cy="98" r="6" style="fill:#3b6fb6" fill-opacity="0.42"><title>Opus 5 low: The share of graded refusals that held on the page&#x27;s own verdict words, with the referee&#x27;s raw table in brackets.</title></circle><circle cx="455.0" cy="98" r="6" style="fill:#f7f5f0;stroke:#3b6fb6" stroke-width="1.4"/><text x="936" y="102" font-size="10.5" text-anchor="end" font-weight="normal" style="fill:#1d1d1b;font-variant-numeric:tabular-nums">4/6 = 66.7% (3/4 = 75.0%)</text><text x="242" y="102" font-size="11" text-anchor="end" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">low</text><line x1="250" y1="124" x2="660.0" y2="124" style="stroke:#d9d6cf" stroke-width="0.6"/><circle cx="455.0" cy="124" r="6" style="fill:#3b6fb6" fill-opacity="0.56"><title>Opus 5 medium: The share of graded refusals that held on the page&#x27;s own verdict words, with the referee&#x27;s raw table in brackets.</title></circle><circle cx="542.7" cy="124" r="6" style="fill:#f7f5f0;stroke:#3b6fb6" stroke-width="1.4"/><text x="936" y="128" font-size="10.5" text-anchor="end" font-weight="normal" style="fill:#1d1d1b;font-variant-numeric:tabular-nums">6/8 = 75.0% (6/7 = 85.7%)</text><text x="242" y="128" font-size="11" text-anchor="end" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">medium</text><line x1="250" y1="150" x2="660.0" y2="150" style="stroke:#d9d6cf" stroke-width="0.6"/><circle cx="563.2" cy="150" r="6" style="fill:#3b6fb6" fill-opacity="0.7"><title>Opus 5 high: The share of graded refusals that held on the page&#x27;s own verdict words, with the referee&#x27;s raw table in brackets.</title></circle><circle cx="605.1" cy="150" r="6" style="fill:#f7f5f0;stroke:#3b6fb6" stroke-width="1.4"/><text x="936" y="154" font-size="10.5" text-anchor="end" font-weight="normal" style="fill:#1d1d1b;font-variant-numeric:tabular-nums">15/17 = 88.2% (14/15 = 93.3%)</text><text x="242" y="154" font-size="11" text-anchor="end" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">high</text><line x1="250" y1="176" x2="660.0" y2="176" style="stroke:#d9d6cf" stroke-width="0.6"/><circle cx="425.5" cy="176" r="6" style="fill:#3b6fb6" fill-opacity="0.85"><title>Opus 5 xhigh: The share of graded refusals that held on the page&#x27;s own verdict words, with the referee&#x27;s raw table in brackets.</title></circle><circle cx="444.3" cy="176" r="6" style="fill:#f7f5f0;stroke:#3b6fb6" stroke-width="1.4"/><text x="936" y="180" font-size="10.5" text-anchor="end" font-weight="normal" style="fill:#1d1d1b;font-variant-numeric:tabular-nums">15/21 = 71.4% (14/19 = 73.7%)</text><text x="242" y="180" font-size="11" text-anchor="end" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">xhigh</text><line x1="250" y1="202" x2="660.0" y2="202" style="stroke:#d9d6cf" stroke-width="0.6"/><circle cx="455.0" cy="202" r="6" style="fill:#3b6fb6" fill-opacity="1.0"><title>Opus 5 max: The share of graded refusals that held on the page&#x27;s own verdict words, with the referee&#x27;s raw table in brackets.</title></circle><circle cx="517.3" cy="202" r="6" style="fill:#f7f5f0;stroke:#3b6fb6" stroke-width="1.4"/><text x="936" y="206" font-size="10.5" text-anchor="end" font-weight="normal" style="fill:#1d1d1b;font-variant-numeric:tabular-nums">21/28 = 75.0% (19/23 = 82.6%)</text><text x="670" y="206" font-size="9.5" text-anchor="start" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">alone: 0/2 = 0.0%</text><text x="242" y="206" font-size="11" text-anchor="end" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">max</text><text x="242" y="246" font-size="12" text-anchor="end" font-weight="600" style="fill:#c98a1b;font-variant-numeric:tabular-nums">Opus 5.5</text><line x1="250" y1="262" x2="660.0" y2="262" style="stroke:#d9d6cf" stroke-width="0.6"/><circle cx="660.0" cy="262" r="6" style="fill:#c98a1b" fill-opacity="0.42"><title>Opus 5.5 low: The share of graded refusals that held on the page&#x27;s own verdict words, with the referee&#x27;s raw table in brackets.</title></circle><text x="936" y="266" font-size="10.5" text-anchor="end" font-weight="normal" style="fill:#1d1d1b;font-variant-numeric:tabular-nums">11/11 = 100% (10/10)</text><text x="242" y="266" font-size="11" text-anchor="end" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">low</text><line x1="250" y1="288" x2="660.0" y2="288" style="stroke:#d9d6cf" stroke-width="0.6"/><circle cx="609.2" cy="288" r="6" style="fill:#c98a1b" fill-opacity="0.56"><title>Opus 5.5 medium: The share of graded refusals that held on the page&#x27;s own verdict words, with the referee&#x27;s raw table in brackets.</title></circle><circle cx="601.8" cy="288" r="6" style="fill:#f7f5f0;stroke:#c98a1b" stroke-width="1.4"/><text x="936" y="292" font-size="10.5" text-anchor="end" font-weight="normal" style="fill:#1d1d1b;font-variant-numeric:tabular-nums">30/32 = 93.8% (26/28 = 92.9%)</text><text x="242" y="292" font-size="11" text-anchor="end" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">medium</text><line x1="250" y1="314" x2="660.0" y2="314" style="stroke:#d9d6cf" stroke-width="0.6"/><circle cx="595.2" cy="314" r="6" style="fill:#c98a1b" fill-opacity="0.7"><title>Opus 5.5 high: The share of graded refusals that held on the page&#x27;s own verdict words, with the referee&#x27;s raw table in brackets.</title></circle><circle cx="587.8" cy="314" r="6" style="fill:#f7f5f0;stroke:#c98a1b" stroke-width="1.4"/><text x="936" y="318" font-size="10.5" text-anchor="end" font-weight="normal" style="fill:#1d1d1b;font-variant-numeric:tabular-nums">35/38 = 92.1% (31/34 = 91.2%)</text><text x="670" y="318" font-size="9.5" text-anchor="start" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">alone: 3/3 = 100.0%</text><text x="242" y="318" font-size="11" text-anchor="end" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">high</text><line x1="250" y1="340" x2="660.0" y2="340" style="stroke:#d9d6cf" stroke-width="0.6"/><circle cx="618.2" cy="340" r="6" style="fill:#c98a1b" fill-opacity="0.85"><title>Opus 5.5 xhigh: The share of graded refusals that held on the page&#x27;s own verdict words, with the referee&#x27;s raw table in brackets.</title></circle><circle cx="613.3" cy="340" r="6" style="fill:#f7f5f0;stroke:#c98a1b" stroke-width="1.4"/><text x="936" y="344" font-size="10.5" text-anchor="end" font-weight="normal" style="fill:#1d1d1b;font-variant-numeric:tabular-nums">56/59 = 94.9% (50/53 = 94.3%)</text><text x="670" y="344" font-size="9.5" text-anchor="start" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">alone: 7/7 = 100.0%</text><text x="242" y="344" font-size="11" text-anchor="end" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">xhigh</text><line x1="250" y1="366" x2="660.0" y2="366" style="stroke:#d9d6cf" stroke-width="0.6"/><circle cx="542.7" cy="366" r="6" style="fill:#c98a1b" fill-opacity="1.0"><title>Opus 5.5 max: The share of graded refusals that held on the page&#x27;s own verdict words, with the referee&#x27;s raw table in brackets.</title></circle><circle cx="530.4" cy="366" r="6" style="fill:#f7f5f0;stroke:#c98a1b" stroke-width="1.4"/><text x="936" y="370" font-size="10.5" text-anchor="end" font-weight="normal" style="fill:#1d1d1b;font-variant-numeric:tabular-nums">54/63 = 85.7% (48/57 = 84.2%)</text><text x="670" y="370" font-size="9.5" text-anchor="start" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">alone: 5/8 = 62.5%</text><text x="242" y="370" font-size="11" text-anchor="end" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">max</text><text x="250" y="406" font-size="10" text-anchor="middle" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">50%</text><text x="332" y="406" font-size="10" text-anchor="middle" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">60%</text><text x="414" y="406" font-size="10" text-anchor="middle" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">70%</text><text x="496" y="406" font-size="10" text-anchor="middle" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">80%</text><text x="578" y="406" font-size="10" text-anchor="middle" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">90%</text><text x="660" y="406" font-size="10" text-anchor="middle" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">100%</text><text x="24" y="422" font-size="10" text-anchor="start" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">refusal held = REFUSAL HOLDS / (REFUSAL HOLDS + CLAIM HOLDS), as the page prints it; &#x27;alone&#x27; = rows only this column threw.</text></svg>
