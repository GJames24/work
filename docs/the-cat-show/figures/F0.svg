<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" viewBox="0 0 960 230" role="img" aria-labelledby="F0-t" font-family="ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12"><title id="F0-t">two seats, two tapes, the engine stamps</title><defs><pattern id="miss-F0" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" style="fill:#ece9e2"/><line x1="0" y1="0" x2="0" y2="6" style="stroke:#b5b1a8" stroke-width="2"/></pattern></defs><rect width="960" height="230" style="fill:#f7f5f0"/><text x="24" y="26" font-size="15" text-anchor="start" font-weight="600" style="fill:#1d1d1b;font-variant-numeric:tabular-nums">Two seats, two tapes: the engine stamp each seat was examined on</text><text x="24" y="44" font-size="11" text-anchor="start" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">a stamp is the record&#x27;s token; where two stamps disagree on one tape both are printed, never reconciled</text><text x="24" y="92" font-size="11" text-anchor="start" font-weight="600" style="fill:#1d1d1b;font-variant-numeric:tabular-nums">THE READER SEAT</text><text x="190" y="92" font-size="26" text-anchor="start" font-weight="600" style="fill:#1d1d1b;font-variant-numeric:tabular-nums">d101</text><rect x="290" y="70" width="200" height="34" style="fill:none;stroke:#1d1d1b" stroke-width="1"/><text x="298" y="90" font-size="13" text-anchor="start" font-weight="600" style="fill:#1d1d1b;font-variant-numeric:tabular-nums">engine 8.55</text><text x="298" y="116" font-size="9" text-anchor="start" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">the tape&#x27;s own launch line</text><rect x="506" y="70" width="200" height="34" style="fill:none;stroke:#1d1d1b" stroke-width="1"/><text x="514" y="90" font-size="13" text-anchor="start" font-weight="600" style="fill:#1d1d1b;font-variant-numeric:tabular-nums">engine 8.56</text><text x="514" y="116" font-size="9" text-anchor="start" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">the exam room&#x27;s reading</text><text x="728" y="90" font-size="10" text-anchor="start" font-weight="600" style="fill:#6b6b66;font-variant-numeric:tabular-nums">two stamps, one tape</text><text x="24" y="158" font-size="11" text-anchor="start" font-weight="600" style="fill:#1d1d1b;font-variant-numeric:tabular-nums">THE SKEPTIC SEAT</text><text x="190" y="158" font-size="26" text-anchor="start" font-weight="600" style="fill:#1d1d1b;font-variant-numeric:tabular-nums">d100</text><rect x="290" y="136" width="200" height="34" style="fill:none;stroke:#1d1d1b" stroke-width="1"/><text x="298" y="156" font-size="13" text-anchor="start" font-weight="600" style="fill:#1d1d1b;font-variant-numeric:tabular-nums">engine 8.55</text><text x="298" y="182" font-size="9" text-anchor="start" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">the tape and the exam room agree</text></svg>
