<svg xmlns="http://www.w3.org/2000/svg" width="960" viewBox="0 0 960 490" role="img" aria-labelledby="M0-t" font-family="ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12"><title id="M0-t">the judging ring: how a day becomes a score</title><defs><pattern id="miss-M0" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" style="fill:#ece9e2"/><line x1="0" y1="0" x2="0" y2="6" style="stroke:#b5b1a8" stroke-width="2"/></pattern></defs><rect width="960" height="490" style="fill:#f7f5f0"/><text x="24" y="26" font-size="15" text-anchor="start" font-weight="600" style="fill:#1d1d1b;font-variant-numeric:tabular-nums">The judging ring · how a day becomes a score</text><circle cx="480" cy="245" r="140" style="fill:none;stroke:#1d1d1b" stroke-width="1.2"/><circle cx="480" cy="245" r="132" style="fill:none;stroke:#d9d6cf" stroke-width="0.8"/><line x1="480.0" y1="83.0" x2="480.0" y2="71.0" style="stroke:#6b6b66" stroke-width="0.8"/><circle cx="480.0" cy="105.0" r="22" style="fill:#f7f5f0;stroke:#1d1d1b" stroke-width="1.2"/><text x="480" y="109" font-size="13" text-anchor="middle" font-weight="600" style="fill:#1d1d1b;font-variant-numeric:tabular-nums">1</text><text x="480" y="37" font-size="12" text-anchor="middle" font-weight="600" style="fill:#1d1d1b;font-variant-numeric:tabular-nums">THE TAPE</text><text x="480" y="51" font-size="10" text-anchor="middle" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">a day of real work, every</text><text x="480" y="65" font-size="10" text-anchor="middle" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">thought and dollar on record</text><line x1="642.0" y1="245.0" x2="654.0" y2="245.0" style="stroke:#6b6b66" stroke-width="0.8"/><circle cx="620.0" cy="245.0" r="22" style="fill:#f7f5f0;stroke:#1d1d1b" stroke-width="1.2"/><text x="620" y="249" font-size="13" text-anchor="middle" font-weight="600" style="fill:#1d1d1b;font-variant-numeric:tabular-nums">2</text><text x="660" y="235" font-size="12" text-anchor="start" font-weight="600" style="fill:#1d1d1b;font-variant-numeric:tabular-nums">THE READERS</text><text x="660" y="249" font-size="10" text-anchor="start" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">find what nobody has named;</text><text x="660" y="263" font-size="10" text-anchor="start" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">file each claim with its rows</text><line x1="480.0" y1="407.0" x2="480.0" y2="419.0" style="stroke:#6b6b66" stroke-width="0.8"/><circle cx="480.0" cy="385.0" r="22" style="fill:#f7f5f0;stroke:#1d1d1b" stroke-width="1.2"/><text x="480" y="389" font-size="13" text-anchor="middle" font-weight="600" style="fill:#1d1d1b;font-variant-numeric:tabular-nums">3</text><text x="480" y="433" font-size="12" text-anchor="middle" font-weight="600" style="fill:#1d1d1b;font-variant-numeric:tabular-nums">THE SKEPTIC</text><text x="480" y="447" font-size="10" text-anchor="middle" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">take a claim and try to refute</text><text x="480" y="461" font-size="10" text-anchor="middle" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">it</text><line x1="318.0" y1="245.0" x2="306.0" y2="245.0" style="stroke:#6b6b66" stroke-width="0.8"/><circle cx="340.0" cy="245.0" r="22" style="fill:#f7f5f0;stroke:#1d1d1b" stroke-width="1.2"/><text x="340" y="249" font-size="13" text-anchor="middle" font-weight="600" style="fill:#1d1d1b;font-variant-numeric:tabular-nums">4</text><text x="300" y="235" font-size="12" text-anchor="end" font-weight="600" style="fill:#1d1d1b;font-variant-numeric:tabular-nums">THE REFEREES</text><text x="300" y="249" font-size="10" text-anchor="end" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">re-grade blind, both families,</text><text x="300" y="263" font-size="10" text-anchor="end" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">every verdict stripped</text><g class="cat" transform="translate(452,215)" style="color:#1d1d1b" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M14 22 L10 6 L22 16 L34 16 L46 6 L42 22 Q52 34 46 48 L10 48 Q4 34 14 22 Z"/><path d="M46 48 Q62 46 60 30"/><circle cx="22" cy="30" r="1.6" style="fill:currentColor"/><circle cx="34" cy="30" r="1.6" style="fill:currentColor"/><path d="M24 38 Q28 42 32 38"/></g><text x="480" y="283" font-size="10" text-anchor="middle" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">the cat: reflex only, cannot lie;</text><text x="480" y="296" font-size="10" text-anchor="middle" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">the town&#x27;s honesty baseline</text><text x="24" y="480" font-size="9.5" text-anchor="start" font-weight="normal" style="fill:#6b6b66;font-variant-numeric:tabular-nums">motif figure; carries no data</text></svg>
